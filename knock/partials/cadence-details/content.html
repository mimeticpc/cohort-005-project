<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:14px 0 0;border-top:1px solid #e4e4e7">
  <tr>
    <td width="30%" valign="top" style="padding:8px 0;border-bottom:1px solid #e4e4e7;font-size:13px;color:#71717a">Amount</td>
    <td valign="top" style="padding:8px 0;border-bottom:1px solid #e4e4e7;font-size:14px;color:#171717">{{ amount | escape }}</td>
  </tr>
  <tr>
    <td width="30%" valign="top" style="padding:8px 0;border-bottom:1px solid #e4e4e7;font-size:13px;color:#71717a">Purchased</td>
    <td valign="top" style="padding:8px 0;border-bottom:1px solid #e4e4e7;font-size:14px;color:#171717">{{ purchased_on | escape }}</td>
  </tr>
  <tr>
    <td width="30%" valign="top" style="padding:8px 0;border-bottom:1px solid #e4e4e7;font-size:13px;color:#71717a">{{ note_label | escape }}</td>
    <td valign="top" style="padding:8px 0;border-bottom:1px solid #e4e4e7;font-size:14px;color:#171717">{% if note and note != "" %}{{ note | escape }}{% else %}—{% endif %}</td>
  </tr>
</table>
